name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        # pgvector for the RAG tables. Debian-based, unlike the local
        # image (db/docker/Dockerfile) — fine here, since CI always starts
        # from an empty database.
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: techhire
          POSTGRES_PASSWORD: localdev
          POSTGRES_DB: techhire_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U techhire"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://techhire:localdev@localhost:5432/techhire_db

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest -v

  frontend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        run: npm run build
